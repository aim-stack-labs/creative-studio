<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0; padding:0; box-sizing:border-box}
body{margin:0; padding:0; background:#f5f5f5; font-family:Arial}
.gallery{display:flex; flex-wrap:wrap; justify-content:center; gap:20px; padding:20px; padding-bottom:20px}
.card{background:white; width:320px; height:560px; border-radius:20px; overflow:hidden; box-shadow:0 4px 10px rgba(0,0,0,0.1)}
.card img{width:100%; height:100%; object-fit:cover; display:block}
footer{text-align:center; padding:20px; font-weight:bold}

@media(max-width:600px){
  .gallery{gap:15px; padding:10px}
  .card{width:90%; height:520px}
}
</style>
</head>
<body>

<div class="gallery">
<div class="card"><img src="UI-Images/2nd UI Design.png" alt="UIDesign1"></div>
<div class="card"><img src="UI-Images/3rd UI Design.png" alt="UIDesign2"></div>
<div class="card"><img src="UI-Images/4th UI Design.png" alt="UIDesign3"></div>
<div class="card"><img src="UI-Images/5th UI Design.png" alt="UIDesign4"></div>
<div class="card"><img src="UI-Images/6th UI Design.png" alt="UIDesign5"></div>
</div>

<footer>© 2026 Aim Stack Labs</footer>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anchor Tag</title>
</head>
<body>
    <!-- Anchor Tags  -->
    <!-- ANCHOR TAGS - The Foundation of Navigation -->
    <!-- Used to link pages, websites & resources -->
    <!-- Mainly used for Producing Links -->
     
    <h1>Anchor Tag</h1>
    <!-- External Link - Open Website in Same Tab  -->
    <a href="https://www.daraz.pk/#?">Go To Daraz</a>
    
    <!-- Internal Link - Links to Another Page in Same Folder -->
    <a href="heading-tags.html">Go to Headings Page</a>

     <!-- Image as a Link - Clickable Image -->
      <a href="https://www.google.com/">
        <img src="google logo.png" alt="Google Logo">
      </a>

      <!-- Button Inside Anchor Tag -->
       <a href="https://www.daraz.pk/#?">
       <button>Go to Daraz</button>
    </a>
</body>
</html>

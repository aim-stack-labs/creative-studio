<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heading Tags</title>
</head>

<body>
    <!-- 6 Headings Tag used in Development -->
 <!-- HEADING TAGS (H1-H6) - Structure of a Web Page -->
  <!-- Important for SEO, Accessibility & Content Hierarchy -->
      
    <h1>Heading Tags</h1>
    <!-- H1 - Main Heading - Largest & Most Important Heading -->
    <h1>Hyper Text Markup Language</h1>

    <!-- H2 to H6 - Sub-headings - Size and Importance Decreases from H2 to H6 -->
    <h2>Hyper Text Markup Language</h2>
    <h3>Hyper Text Markup Language</h3>
    <h4>Hyper Text Markup Language</h4>
    <h5>Hyper Text Markup Language</h5>
    <h6>Hyper Text Markup Language</h6>
</body>
</html>

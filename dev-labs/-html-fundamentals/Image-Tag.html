<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Tag</title>
</head>
<body>
    <!-- Image Tags  -->
     <!-- IMAGE TAGS - To Display Images on Web Page -->
      <!-- Important for UI, Performance & SEO Optimization -->
      <h1>Image Tag</h1>
    <!-- Basic Image Tag with Alt Text for SEO and Accessibility -->
    <img src="google logo.png" alt="My Photo">

    <!-- Image with Width and Height - Prevents Laout Shift -->
     <img src="google logo.png" alt="My Photo" width="300px" height="200px">

     <!-- Image from External URL / CDN -->
      <img src="google logo.png" alt="Website Logo">
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <!-- TABLE - Used to Display Dta in Rows and Columns Formats -->
     <h1>Table</h1>
    <table>
        <!-- THEAD - Defines Header Section of the Table -->
        <thead>
            <!-- TR - Table Row - Defines a Horizontal Row in Table -->
            <tr> 
                 <!-- TH - Table Header - Defines Header Cell (Bold & Center) -->
                <th>Sr No</th> 
                <th>Name</th>
                <th>Age</th>
                <th>Qualification</th>
                <th>Grade</th>
            </tr>
             </thead>
             <!-- TBODY - Defines Body Section of the Table -->
            <tbody> 
                <!-- TR - Table Row for Body Data -->
                <tr> 
                <!-- TD - Table Data - Defines a Standard Data Cell -->
                <td>1</td>
                <td>Aiman</td>
                <td>20</td>
                <td>BS IT</td>
                <td>A</td>
                </tr>
            </tbody>
    </table>
</body>
</html>
